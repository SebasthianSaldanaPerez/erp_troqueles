services:
  postgres:
    image: postgres:17
    container_name: troqueles-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: troqueles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      volumes:
          - troqueles_postgres_data:/var/lib/postgresql/data
          - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
          test:
            [
              "CMD-SHELL",
              "pg_isready -U postgres -d troqueles"
            ]
          interval: 5s
          timeout: 5s
          retries: 10


volumes:
  troqueles_postgres_data: